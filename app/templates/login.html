{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="lp-page-head"><div><h1>Sign in</h1><p>Manage your links and see how they perform.</p></div></div>
    <form method="post" class="lp-panel">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-label" for="email">Email</label>
      <input class="form-control mb-3" type="email" id="email" name="email" autocomplete="username" required autofocus>
      <label class="form-label" for="password">Password</label>
      <input class="form-control mb-3" type="password" id="password" name="password" autocomplete="current-password" required>
      <button class="btn btn-primary w-100">Sign in</button>
      <p class="small text-secondary mt-3 mb-0">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
    </form>
  </div>
</div>
{% endblock %}
