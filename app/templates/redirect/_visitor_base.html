<!doctype html>
<html lang="en">
<script>try{if(matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.setAttribute("data-bs-theme","dark")}catch(e){}</script>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}ShortPulse{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..750&family=JetBrains+Mono:wght@500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body>
  <div class="lp-bg" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <div class="lp-visitor">
    <div class="box">
      {% block body %}{% endblock %}
      <p class="foot">Short link <span class="code">/{{ code }}</span> by ShortPulse · <a href="{{ url_for('views.privacy') }}">Privacy</a></p>
    </div>
  </div>
</body>
</html>
