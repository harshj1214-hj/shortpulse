{% extends "redirect/_visitor_base.html" %}
{% block title %}Password required{% endblock %}
{% block body %}
  <h1 class="h3">This link is password protected</h1>
  <p>Enter the password you were given to continue.</p>
  <form method="post" novalidate>
    <label class="form-label" for="password">Password</label>
    <input class="form-control{% if error %} is-invalid{% endif %}" type="password" id="password" name="password"
           autocomplete="off" required autofocus{% if error %} aria-describedby="pw-error"{% endif %}>
    {% if error %}<div class="invalid-feedback" id="pw-error">{{ error }}</div>{% endif %}
    <button class="btn btn-primary w-100 mt-3" type="submit">Open link</button>
  </form>
{% endblock %}
