{% extends "base.html" %}
{% block title %}Poster{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mt-3 no-print">
  <a href="{{ url_for('views.studio', link_id=link.id) }}">Back to the QR studio</a>
  <button class="btn btn-primary" onclick="window.print()">Print poster</button>
</div>
<article class="lp-poster">
  <h1>{{ link.title or 'Scan me' }}</h1>
  <img src="{{ url_for('studio.qr_png', link_id=link.id, size=1200) }}" alt="QR code">
  <p class="url">{{ link.short_url.split('://', 1)[1] }}</p>
  <p class="text-secondary mb-0">Scan with your phone camera or type the address above.</p>
</article>
{% endblock %}
