{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="lp-page-head"><div><h1>Create your account</h1><p>You'll be able to create links straight away.</p></div></div>
    <form method="post" class="lp-panel">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-label" for="email">Email</label>
      <input class="form-control mb-3" type="email" id="email" name="email" autocomplete="email" required autofocus>
      <label class="form-label" for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password" minlength="8" autocomplete="new-password" required aria-describedby="pw-help">
      <div class="form-text mb-3" id="pw-help">At least 8 characters.</div>
      <button class="btn btn-primary w-100">Create account</button>
      <p class="small text-secondary mt-3 mb-0">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
    </form>
  </div>
</div>
{% endblock %}
