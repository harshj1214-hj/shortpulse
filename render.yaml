# Render Blueprint. Free web services have an ephemeral filesystem: the SQLite
# database is wiped on every deploy, restart and spin-down. SEED_ON_START=1
# rebuilds the demo data on boot. For data that must survive, use a paid
# instance with a persistent disk and set DATABASE_PATH to the disk's mount path.
services:
  - type: web
    name: shortpulse
    runtime: python
    plan: free
    buildCommand: bash build.sh
    # One process: the C hash table and rate limiter live in process memory.
    # Threads give concurrency; SQLite's write lock keeps click limits exact.
    startCommand: gunicorn wsgi:app --workers 1 --threads 8 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      - key: TRUSTED_PROXIES
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: SEED_ON_START
        value: "1"
      - key: ADMIN_EMAIL
        value: admin@shortpulse.local
      - key: GA_MEASUREMENT_ID          # Google Analytics, ShortPulse's own pages only
        value: G-4C6XT5QZFH
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: BASE_URL
        sync: false
